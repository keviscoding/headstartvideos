<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ChannelRecipe Discord</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/static/favicon.svg?v=pot1" type="image/svg+xml">
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
    <style>
        :root { --canvas: #F7F5F0; --ink: #16161A; --ink-2: #55534D; --hairline: #E5E1D8; --accent: #6D5AE0; --accent-hover: #5A48C9; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; background: var(--canvas); color: var(--ink); font-family: "General Sans", system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 48px 16px; }
        .brand { display: flex; align-items: center; gap: 10px; font-family: "Cabinet Grotesk", system-ui, sans-serif; font-size: 20px; margin-bottom: 32px; color: var(--ink); text-decoration: none; }
        .brand b { font-weight: 800; } .brand span { color: var(--accent); }
        .card { width: 100%; max-width: 440px; background: #fff; border: 1px solid var(--hairline); border-radius: 18px; padding: 32px 28px; }
        h1 { font-family: "Cabinet Grotesk", system-ui, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
        p { color: var(--ink-2); font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        a.button { flex: 1; min-width: 140px; text-align: center; padding: 14px 16px; border-radius: 12px; font-weight: 600; text-decoration: none; }
        .primary { background: var(--accent); color: #fff; } .primary:hover { background: var(--accent-hover); }
        .secondary { border: 1px solid var(--hairline); color: var(--ink); }
    </style>
</head>
<body>
    <a class="brand" href="/"><img src="/static/glyph.svg?v=pot1" width="30" height="30" alt=""><b>Channel<span>Recipe</span></b></a>
    <main class="card">
        <h1>The Discord is for members</h1>
        <p>Join ChannelRecipe to get help from the team, share your videos and take part in giveaways. You get the invite as soon as you subscribe.</p>
        <p>Already a member? Sign in on this browser, then open the Discord link again.</p>
        <div class="actions"><a class="button primary" href="/#pricing">See plans</a><a class="button secondary" href="/app">Sign in</a></div>
    </main>
</body>
</html>
