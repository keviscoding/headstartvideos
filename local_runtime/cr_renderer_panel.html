<style>
#cr-renderer-panel{margin:22px 0;padding:20px;border:1px solid #363451;border-radius:16px;background:#171b2e;color:#edeef5;font:14px/1.6 system-ui}#cr-renderer-panel h3{font-size:17px;margin:0 0 8px}#cr-renderer-panel p{color:#a7acc4;margin:6px 0 12px}#cr-renderer-panel button{background:#6d5ae0;border:0;border-radius:9px;padding:11px 16px;color:white;cursor:pointer}#cr-renderer-panel button:disabled{opacity:.45;cursor:wait}#cr-renderer-panel label{display:flex;gap:12px;align-items:center;margin:12px 0}#cr-renderer-panel input{accent-color:#6d5ae0;width:18px;height:18px}#cr-renderer-panel [hidden]{display:none!important}#cr-renderer-progress{font-variant-numeric:tabular-nums;padding:12px;background:#0f1222;border-radius:10px}#cr-renderer-panel a{color:#b4a7ff}#cr-renderer-error,#cr-recovery-error{color:#f0a4b1!important}#cr-recovery-panel{border-top:1px solid #363451;margin-top:18px;padding-top:14px}.cr-recovery-choice{padding:14px 0;border-bottom:1px solid #363451}.cr-recovery-choice strong{display:block}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const go=document.getElementById('go');if(!go)return;
 const panel=document.createElement('section');panel.id='cr-renderer-panel';
 panel.innerHTML='<h3>Optional · Fast mode <small title="Three local render trials; excludes Claude and media generation">2.3× measured sample</small></h3><p>Use the faster graphics engine for every 3D scene in this project. Claude still directs, reviews and improves the scenes using your connected account. Enable 3D scenes in your preset first.</p><label><input type="checkbox" id="cr-renderer-toggle" disabled>Use Fast mode for this 3D project</label><button type="button" id="cr-renderer-install">Install and check Fast mode</button><p id="cr-renderer-status" role="status">Checking optional renderer…</p><p id="cr-renderer-error" role="alert" hidden></p><div id="cr-renderer-progress" role="status" hidden></div><details><summary>What to expect</summary><p>This installs a separate Python package and renders a short local check. It does not spend Claude or media credits. Python 3.13 or newer is required.</p><p>Claude reads the pinned ManimGX documentation and uses the fast engine for your scene plan. Unsupported requests stop with an explanation. Your choice is saved with the project; existing projects keep their renderer.</p><p>Our three local render trials measured 2.3× faster graphics rendering for a 2.6-second scene at 640 × 360 and 30 fps, including process startup. Your scene and computer will change the result. Writing, media generation and Claude’s reviews take additional time. ManimGX’s published 90× result compares against ManimCE, a different renderer.</p></details>';
 go.insertAdjacentElement('beforebegin',panel);
 const toggle=panel.querySelector('#cr-renderer-toggle'),install=panel.querySelector('#cr-renderer-install'),status=panel.querySelector('#cr-renderer-status'),progress=panel.querySelector('#cr-renderer-progress'),setupError=panel.querySelector('#cr-renderer-error');
 const recoveryPanel=document.createElement('details');recoveryPanel.id='cr-recovery-panel';
 recoveryPanel.innerHTML='<summary>Recover a stopped 3D scene</summary><p>If an earlier studio version stopped after Claude completed its 3D code, check the saved response here. Local validation uses no model or media credits. It can still fail the API checker; any Claude correction is a separate choice.</p><button type="button" id="cr-recovery-find">Find saved 3D work</button><p id="cr-recovery-message" role="status"></p><p id="cr-recovery-error" role="alert" hidden></p><div id="cr-recovery-choices"></div><p>These actions keep your video stopped. After code passes validation, resume your existing project manually with its same title, preset and Fast mode option. Its original reviews still run.</p>';
 panel.append(recoveryPanel);
 const recoveryFind=recoveryPanel.querySelector('#cr-recovery-find'),recoveryMessage=recoveryPanel.querySelector('#cr-recovery-message'),recoveryError=recoveryPanel.querySelector('#cr-recovery-error'),recoveryChoices=recoveryPanel.querySelector('#cr-recovery-choices');
 let recoveryPosting=false,recoveryFinding=false,studioBusy=false,lastRecovery={};
 function updateRecoveryButtons(){
  recoveryFind.disabled=recoveryPosting||recoveryFinding||studioBusy;
  for(const card of recoveryChoices.children){
   const same=lastRecovery.project_id===card.dataset.project&&lastRecovery.selection_id===card.dataset.selection;
   const state=same?lastRecovery.state:card.dataset.state;
   const validate=card.querySelector('[data-action="validate"]'),correct=card.querySelector('[data-action="correct"]'),ack=card.querySelector('input');
   const validationUsed=same&&lastRecovery.action==='validate';
   if(validate)validate.disabled=recoveryPosting||studioBusy||card.dataset.canValidate!=='true'||validationUsed||(same&&state==='running');
   if(correct)correct.disabled=recoveryPosting||studioBusy||state!=='source_invalid'||!ack.checked;
  }
 }
 function drawRecovery(result={}){lastRecovery=result;if(result.message){recoveryPanel.open=true;const message=studioBusy&&result.state==='validated'?'Saved 3D code passed validation. A studio job is running; follow its progress below.':result.message;recoveryMessage.textContent=(result.title?result.title+' · ':'')+message.replaceAll('ManimGX','Fast mode');}updateRecoveryButtons();}
 async function recoveryAction(choice,action){
  recoveryPosting=true;recoveryError.hidden=true;recoveryError.textContent='';updateRecoveryButtons();
  try{const response=await fetch('/cr-renderer/recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,project_id:choice.project_id,selection_id:choice.selection_id,[action==='correct'?'acknowledge_correction':'acknowledge_recovery']:true})});const data=await response.json();if(!response.ok)throw Error(data.error||'The saved-scene action could not start.');drawRecovery(data.recovery);}
  catch(error){recoveryError.textContent=error.message;recoveryError.hidden=false;}
  finally{recoveryPosting=false;updateRecoveryButtons();await refresh();}
 }
 recoveryFind.addEventListener('click',async()=>{
  recoveryFinding=true;recoveryError.hidden=true;recoveryError.textContent='';updateRecoveryButtons();
  try{const response=await fetch('/cr-renderer/recovery');const data=await response.json();if(!response.ok)throw Error(data.error||'Saved 3D work could not be checked.');recoveryChoices.replaceChildren();
   for(const choice of data.choices||[]){const card=document.createElement('div');card.className='cr-recovery-choice';card.dataset.project=choice.project_id;card.dataset.selection=choice.selection_id;card.dataset.state=choice.state;card.dataset.canValidate=choice.can_validate===true?'true':'false';const title=document.createElement('strong');title.textContent=choice.title+' · '+choice.scene_id;card.append(title);const note=document.createElement('p');note.textContent=['validated','corrected'].includes(choice.state)?'Code passed validation. Resume the existing video manually to continue its original reviews.':choice.state==='source_invalid'&&choice.can_correct?'The completed code failed the local API checker. You may explicitly ask Claude for one correction using your account allowance. This does not regenerate the whole video.':choice.can_validate?'A completed response is available. Check it locally without calling Claude.':'This saved action is stopped. Review its saved status before doing more work.';card.append(note);
    if(choice.can_validate){const button=document.createElement('button');button.type='button';button.dataset.action='validate';button.textContent='Validate saved 3D code · no credits';button.addEventListener('click',()=>recoveryAction(choice,'validate'));card.append(button);}
    if(choice.can_correct){const label=document.createElement('label'),ack=document.createElement('input');ack.type='checkbox';ack.addEventListener('change',updateRecoveryButtons);label.append(ack,document.createTextNode('Use my Claude account for one correction to this saved scene.'));card.append(label);const button=document.createElement('button');button.type='button';button.dataset.action='correct';button.textContent='Correct saved 3D code';button.disabled=true;button.addEventListener('click',()=>recoveryAction(choice,'correct'));card.append(button);}
    recoveryChoices.append(card);
   }
   drawRecovery(data.recovery||{});if(!data.choices?.length)recoveryMessage.textContent=data.message||'No completed 3D responses need this recovery. Original stopped work has been preserved.';else if(data.message){const note=document.createElement('p');note.textContent=data.message;recoveryChoices.append(note);}
  }catch(error){recoveryError.textContent=error.message;recoveryError.hidden=false;}finally{recoveryFinding=false;updateRecoveryButtons();}
 });
 let checking=false,posting=false,rendererReady=false; toggle.addEventListener('change',()=>{toggle.disabled=!rendererReady&&!toggle.checked;});
 async function refresh(){if(checking)return;checking=true;try{const response=await fetch('/cr-renderer');const data=await response.json();if(!response.ok)throw Error(data.error||'Renderer status unavailable.');const running=['installing','checking','rendering'].includes(data.setup?.state);studioBusy=!!data.busy;drawRecovery(data.recovery||{});rendererReady=data.ready&&!running;toggle.disabled=!rendererReady&&!toggle.checked;install.disabled=posting||data.busy||running;install.textContent=data.ready?'Check Fast mode again':'Install and check Fast mode';const staleReady=data.setup?.state==='ready'&&!data.ready;status.textContent=staleReady?(data.message||'Run the Fast mode setup check again.'):(data.setup?.message||data.message);const scenes=data.progress?.scenes||{};const rows=Array.isArray(scenes)?scenes:Object.values(scenes);progress.replaceChildren();for(const scene of rows){const line=document.createElement('div'),frames=Number(scene.frames_done||scene.frame||scene.frames||0),seconds=Number(scene.elapsed_seconds||scene.elapsed||0);const compiling=scene.stage==='compile'&&scene.state==='running';line.textContent=(scene.scene_id||'Scene')+' · '+(compiling?'Claude is writing 3D code':scene.state==='running'&&scene.stage==='export'?'Exporting':scene.event||scene.state||'rendering')+(compiling?'':' · '+frames+' frames'+(scene.total_frames?' / '+scene.total_frames:'')+' · '+seconds.toFixed(1)+'s'+(seconds>0&&frames?' · '+(frames/seconds).toFixed(1)+' frames/sec':''));progress.append(line);}progress.hidden=!rows.length;}catch(error){status.textContent=error.message;rendererReady=false;toggle.disabled=!toggle.checked;}finally{checking=false;}}
 install.addEventListener('click',async()=>{posting=true;install.disabled=true;setupError.hidden=true;setupError.textContent='';try{const response=await fetch('/cr-renderer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'install'})});const data=await response.json();if(!response.ok)throw Error(data.error||'Renderer setup could not start.');}catch(error){setupError.textContent=error.message;setupError.hidden=false;}finally{posting=false;}await refresh();});
 const previousFetch=window.fetch.bind(window);window.fetch=(url,opts={})=>{const path=new URL(url instanceof Request?url.url:url,location.href);if(path.origin===location.origin&&path.pathname==='/api/run'&&opts.method?.toUpperCase()==='POST'&&typeof opts.body==='string'){try{const body=JSON.parse(opts.body);body.render_backend=toggle.checked?'manimgx':'original';opts={...opts,body:JSON.stringify(body)};}catch(error){return Promise.reject(Error('The video form could not save its renderer choice. Refresh and try again.'));}}return previousFetch(url,opts);};
 refresh();setInterval(refresh,2000);
});
</script>
