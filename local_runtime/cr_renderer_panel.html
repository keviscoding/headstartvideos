<style>
#cr-renderer-panel{margin:22px 0;padding:20px;border:1px solid #363451;border-radius:16px;background:#171b2e;color:#edeef5;font:14px/1.6 system-ui}#cr-renderer-panel h3{font-size:17px;margin:0 0 8px}#cr-renderer-panel p{color:#a7acc4;margin:6px 0 12px}#cr-renderer-panel button{background:#6d5ae0;border:0;border-radius:9px;padding:11px 16px;color:white;cursor:pointer}#cr-renderer-panel button:disabled{opacity:.45;cursor:wait}#cr-renderer-panel label{display:flex;gap:12px;align-items:center;margin:12px 0}#cr-renderer-panel input{accent-color:#6d5ae0;width:18px;height:18px}#cr-renderer-panel [hidden]{display:none!important}#cr-renderer-progress{font-variant-numeric:tabular-nums;padding:12px;background:#0f1222;border-radius:10px}#cr-renderer-panel a{color:#b4a7ff}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const go=document.getElementById('go');if(!go)return;
 const panel=document.createElement('section');panel.id='cr-renderer-panel';
 panel.innerHTML='<h3>Optional · ManimGX 3D graphics</h3><p>Let Claude build 3D graphics with ManimGX on your computer. It uses the same Claude account and scene reviews. Enable 3D scenes in your preset first.</p><label><input type="checkbox" id="cr-renderer-toggle" disabled>Use ManimGX for this new project</label><button type="button" id="cr-renderer-install">Install and check ManimGX</button><p id="cr-renderer-status" role="status">Checking optional renderer…</p><div id="cr-renderer-progress" role="status" hidden></div><details><summary>What to expect</summary><p>This installs a separate Python package and renders a short local check. It does not spend Claude or media credits. Python 3.13 or newer is required.</p><p>Claude reads the pinned ManimGX documentation and compiles your scene plan. Unsupported scenes stop with an explanation. Your choice is saved with the project; existing projects keep their renderer.</p><p>Rendering speed depends on your scene and computer. The published 90× comparison is against ManimCE; it is not a ChannelRecipe speed guarantee.</p></details>';
 go.insertAdjacentElement('beforebegin',panel);
 const toggle=panel.querySelector('input'),install=panel.querySelector('button'),status=panel.querySelector('#cr-renderer-status'),progress=panel.querySelector('#cr-renderer-progress');
 let checking=false,rendererReady=false; toggle.addEventListener('change',()=>{toggle.disabled=!rendererReady&&!toggle.checked;});
 async function refresh(){if(checking)return;checking=true;try{const response=await fetch('/cr-renderer');const data=await response.json();if(!response.ok)throw Error(data.error||'Renderer status unavailable.');const running=['installing','checking','rendering'].includes(data.setup?.state);rendererReady=data.ready&&!running;toggle.disabled=!rendererReady&&!toggle.checked;install.disabled=data.busy||running;install.textContent=data.ready?'Check ManimGX again':'Install and check ManimGX';status.textContent=data.setup?.message||data.message;const scenes=data.progress?.scenes||{};const rows=Array.isArray(scenes)?scenes:Object.values(scenes);progress.replaceChildren();for(const scene of rows){const line=document.createElement('div'),frames=Number(scene.frames_done||scene.frame||scene.frames||0),seconds=Number(scene.elapsed_seconds||scene.elapsed||0);line.textContent=(scene.scene_id||'Scene')+' · '+(scene.event||scene.state||'rendering')+' · '+frames+' frames'+(scene.total_frames?' / '+scene.total_frames:'')+' · '+seconds.toFixed(1)+'s'+(seconds>0&&frames?' · '+(frames/seconds).toFixed(1)+' frames/sec':'');progress.append(line);}progress.hidden=!rows.length;}catch(error){status.textContent=error.message;rendererReady=false;toggle.disabled=!toggle.checked;}finally{checking=false;}}
 install.addEventListener('click',async()=>{install.disabled=true;try{const response=await fetch('/cr-renderer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'install'})});const data=await response.json();if(!response.ok)throw Error(data.error||'Renderer setup could not start.');}catch(error){status.textContent=error.message;}await refresh();});
 const previousFetch=window.fetch.bind(window);window.fetch=(url,opts={})=>{const path=new URL(url instanceof Request?url.url:url,location.href);if(path.origin===location.origin&&path.pathname==='/api/run'&&opts.method?.toUpperCase()==='POST'&&typeof opts.body==='string'){try{const body=JSON.parse(opts.body);body.render_backend=toggle.checked?'manimgx':'original';opts={...opts,body:JSON.stringify(body)};}catch(error){return Promise.reject(Error('The video form could not save its renderer choice. Refresh and try again.'));}}return previousFetch(url,opts);};
 refresh();setInterval(refresh,2000);
});
</script>
