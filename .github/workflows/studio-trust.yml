name: Studio trusts the computer's certificates
# An antivirus or company firewall that inspects secure connections adds its own root to the computer's certificate
# store. This job does the same with a stand-in root on real Windows and macOS, then checks Studio's Python (requests,
# setup's Network check, Studio's yt-dlp) passes where certifi alone fails (tests/test_studio_trust.py).
on:
  pull_request:
    paths:
      - 'local_runtime/cr_trust.py'
      - 'local_runtime/cr_ytdlp.py'
      - 'local_runtime/cr_network.py'
      - 'tests/test_studio_trust.py'
      - 'tests/studio_trust_lab.py'
      - '.github/workflows/studio-trust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspected:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install pytest requests certifi cryptography "truststore>=0.10.4" "yt-dlp[default]"
      - name: Make a stand-in antivirus root
        run: python tests/studio_trust_lab.py make "${{ runner.temp }}/web-shield"
      - name: Add it to the Windows certificate store, as an antivirus does
        if: runner.os == 'Windows'
        shell: pwsh
        run: Import-Certificate -FilePath "${{ runner.temp }}\web-shield\ca.cer" -CertStoreLocation Cert:\LocalMachine\Root
      - name: Add it to the macOS keychain, as an antivirus does
        if: runner.os == 'macOS'
        run: |
          sudo security authorizationdb write com.apple.trust-settings.admin allow
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "${{ runner.temp }}/web-shield/ca.pem"
      - name: Studio passes behind it
        env:
          CR_TEST_OS_TRUSTED_CA: ${{ runner.temp }}/web-shield
        run: python -m pytest -q -rs tests/test_studio_trust.py
