# Studio runs on creators' own computers, and many of them are Windows PCs. We build on Macs, so Windows-only bugs
# (cp1252 text reads, npm's claude.cmd, ffmpeg paths at the drive letter, a worker dying while it loads Whisper)
# reached creators before us. This runs the tests and starts Studio on Windows before a release does.
name: Windows Studio
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  windows:
    name: Tests and Studio start on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            local_runtime/studio-requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Tools and the computer's text encoding
        # cp1252 here, as on a creator's PC: never set PYTHONUTF8 or PYTHONIOENCODING for the whole job, that would
        # hide the bugs this job is for
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python --version
          node --version
          ffmpeg -hide_banner -version | Select-Object -First 1
          python -c "import locale, sys; print('text encoding:', locale.getencoding(), '| UTF-8 mode:', sys.flags.utf8_mode)"
      - name: Test environment
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt -r requirements-dev.txt -r local_runtime/studio-requirements.txt pytest-timeout
          .venv\Scripts\python -m playwright install chromium
      - name: Tests
        env:
          # Python warns wherever text is read, written or piped without an encoding; tests/conftest.py fails the run
          # when Studio's own code does that
          PYTHONWARNDEFAULTENCODING: '1'
        run: >-
          .venv\Scripts\python -m pytest tests --deselect tests/test_ken_burns_motion.py::test_all_effects
          -p no:cacheprovider -rfEs --timeout 900 --junitxml=windows-tests.xml
      - name: Start Studio as a creator does (tests/studio_smoke/smoke.py)
        # its real launcher in a fresh folder, no keys, npm's claude.cmd; setup, status, diagnostics, Whisper timing
        if: ${{ !cancelled() }}
        run: .venv\Scripts\python tests\studio_smoke\smoke.py --artifacts studio-smoke --report studio-smoke\report.md
      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-studio-report
          path: |
            windows-tests.xml
            studio-smoke
          if-no-files-found: ignore
